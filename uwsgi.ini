[uwsgi]
chdir = /deployment/Full-Stack-Web-App
plugins = python3
module = backend.wsgi:application
master = true
die-on-term = true
processes = 1
virtualenv = %(chdir)/.venv
pythonpath = %(chdir)/.venv/lib/python3.14/site-packages
buffer-size = 32768
#home = .venv
#remove for https
http = 0.0.0.0:5000
